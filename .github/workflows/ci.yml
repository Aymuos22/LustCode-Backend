name: backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lustcode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d lustcode_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/lustcode_test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/lustcode_test
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - name: Check environment file exclusions
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          leaked = [name for name in files if pathlib.Path(name).name.startswith(".env") and pathlib.Path(name).name != ".env.example"]
          assert not leaked, f"Environment files must not be tracked: {leaked}"
          subprocess.run(["git", "check-ignore", "--no-index", "-q", ".env"], check=True)
          subprocess.run(["git", "check-ignore", "--no-index", "-q", ".env.production"], check=True)
          PY
      - run: ruff format --check . && ruff check . && mypy app
      - run: alembic upgrade head && alembic check
      - run: pytest -q
      - run: alembic downgrade base && alembic upgrade head
      - run: docker build -t lustcode-backend:ci .
      - run: python scripts/verify_container_startup.py lustcode-backend:ci
