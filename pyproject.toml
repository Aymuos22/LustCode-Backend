[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lustcode-backend"
version = "0.1.0"
description = "LustCode API and durable code evaluation worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3", "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "redis>=5.2,<8",
  "httpx>=0.28,<1", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3",
  "email-validator>=2.2,<3",
  "Pillow>=12,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "fakeredis[lua]>=2.27,<3", "mypy>=1.14,<2", "openpyxl>=3.1,<4", "jsonschema>=4.23,<5"]
ingest = ["openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL or Docker Compose, as documented by each test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
